<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بلیطی</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* ... (تمام استایل‌های قبلی) ... */
        /* استایل‌های جدید برای مدیریت سانس‌ها */
        .session-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
        .session-item { background:#fff; border:1px solid #e9edf2; border-radius:14px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; }
        .session-item.active { border-color:#2563eb; background:#eff6ff; }
        .session-item .info { flex:1; }
        .session-item .name { font-weight:700; font-size:15px; }
        .session-item .detail { font-size:12px; color:#64748b; margin-top:2px; }
        .session-actions { display:flex; gap:6px; }
        .lock-screen { position:fixed; inset:0; background:#0f172a; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; padding:20px; text-align:center; }
        .lock-screen .lock-icon { font-size:64px; margin-bottom:20px; }
        .lock-screen h2 { font-size:24px; margin-bottom:8px; }
        .lock-screen p { font-size:14px; color:#94a3b8; margin-bottom:24px; }
        .lock-screen input { width:100%; max-width:280px; padding:14px; border-radius:14px; border:1px solid #334155; background:#1e293b; color:#fff; font-size:18px; text-align:center; letter-spacing:6px; margin-bottom:16px; }
        .lock-screen .btn { width:100%; max-width:280px; margin-bottom:10px; }
    </style>
</head>
<body>
    <!-- صفحه قفل -->
    <div id="lockScreen" class="lock-screen">
        <div class="lock-icon">🔐</div>
        <h2>بلیطی</h2>
        <p>برای ورود، اثر انگشت یا رمز عبور را وارد کنید</p>
        <button class="btn btn-primary" id="btnBiometric">👆 ورود با اثر انگشت</button>
        <input type="password" id="lockPassword" placeholder="رمز عبور" maxlength="6">
        <button class="btn btn-outline" id="btnPasswordLogin">ورود با رمز</button>
    </div>

    <!-- محتوای اصلی -->
    <div id="mainApp" style="display:none;">
        <!-- ... (تمام محتوای قبلی: تب ثبت، تب چک، مودال حذف) ... -->
        
        <!-- تب ثبت با مدیریت سانس -->
        <div id="tab-register" class="tab-content active">
            <!-- انتخاب/ایجاد سانس -->
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="font-size:17px;">🎬 سانس‌ها</h3>
                    <button class="btn btn-sm btn-primary" id="btnNewSession">+ سانس جدید</button>
                </div>
                <div id="sessionList" class="session-list"></div>
            </div>
            
            <!-- فرم ثبت بلیط (فقط وقتی سانس انتخاب شده) -->
            <div class="card" id="ticketFormCard" style="display:none;">
                <h3 style="margin-bottom:12px; font-size:17px;">ثبت بلیط در سانس: <span id="currentSessionName"></span></h3>
                <div class="form-row">
                    <div class="form-group"><label>نام خریدار</label><input type="text" id="inputName" placeholder="مثال: علی محمدی"></div>
                    <div class="form-group"><label>تعداد بلیط</label><input type="number" id="inputCount" value="1" min="1"></div>
                    <div class="form-group"><label>ردیف</label><input type="text" id="inputRow" placeholder="مثال: A"></div>
                    <div class="form-group"><label>شماره صندلی</label><input type="text" id="inputSeat" placeholder="مثال: 12"></div>
                </div>
                <button class="btn btn-primary btn-block" id="btnAddTicket">➕ ثبت بلیط</button>
            </div>
            
            <!-- لیست بلیط‌های سانس جاری -->
            <div class="card print-area" id="ticketListCard" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                    <h3 style="font-size:17px;">لیست بلیط‌ها (<span id="ticketCount">0</span>)</h3>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button class="btn btn-sm btn-outline no-print" id="btnPrint">🖨 چاپ</button>
                        <button class="btn btn-sm btn-outline no-print" id="btnExport">📤 خروجی</button>
                        <button class="btn btn-sm btn-danger no-print" id="btnDeleteAll">🗑 حذف کل</button>
                    </div>
                </div>
                <div id="ticketListContainer" class="ticket-list" style="margin-top:12px;"></div>
            </div>
        </div>
        
        <!-- تب چک (بدون تغییر نسبت به نسخه قبل) -->
        <!-- ... -->
    </div>

    <script type="module">
        import { Filesystem, Directory, Encoding } from '@capacitor/filesystem';
        import { BiometricAuth } from '@aparajita/capacitor-biometric-auth';

        // ==================== متغیرها ====================
        let sessions = [];          // آرایه سانس‌ها
        let currentSessionId = null;
        let tickets = [];           // بلیط‌های سانس جاری
        const STORAGE_KEY = 'biliti_data.json';
        let hasPermission = false;
        let html5QrCode = null;
        let isScanning = false;

        // ==================== ذخیره‌سازی ====================
        async function saveData() {
            const data = { sessions, currentSessionId, tickets, version: 1 };
            try {
                await Filesystem.writeFile({
                    path: STORAGE_KEY,
                    data: JSON.stringify(data),
                    directory: Directory.Data,
                    encoding: Encoding.UTF8
                });
            } catch(e) {
                // fallback به localStorage
                localStorage.setItem('biliti_backup', JSON.stringify(data));
                console.warn('Filesystem write failed, using localStorage:', e);
            }
        }

        async function loadData() {
            try {
                const result = await Filesystem.readFile({
                    path: STORAGE_KEY,
                    directory: Directory.Data,
                    encoding: Encoding.UTF8
                });
                const data = JSON.parse(result.data);
                sessions = data.sessions || [];
                currentSessionId = data.currentSessionId || null;
                tickets = data.tickets || [];
            } catch(e) {
                // تلاش برای خواندن از localStorage
                const backup = localStorage.getItem('biliti_backup');
                if (backup) {
                    try {
                        const data = JSON.parse(backup);
                        sessions = data.sessions || [];
                        currentSessionId = data.currentSessionId || null;
                        tickets = data.tickets || [];
                    } catch(err) { sessions = []; tickets = []; }
                } else {
                    sessions = []; tickets = [];
                }
            }
            // اگر بلیط‌های سانس جاری خالی بود ولی سانس‌ها وجود داشت
            if (!tickets.length && currentSessionId) {
                const session = sessions.find(s => s.id === currentSessionId);
                if (session) tickets = session.tickets || [];
            }
        }

        // ==================== مدیریت سانس ====================
        function renderSessions() {
            const container = document.getElementById('sessionList');
            if (!sessions.length) {
                container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:16px;">هنوز سانسی ایجاد نشده است</div>';
                document.getElementById('ticketFormCard').style.display = 'none';
                document.getElementById('ticketListCard').style.display = 'none';
                return;
            }
            let html = '';
            sessions.forEach(s => {
                const isActive = s.id === currentSessionId;
                html += `
                    <div class="session-item ${isActive ? 'active' : ''}" data-id="${s.id}">
                        <div class="info">
                            <div class="name">${escapeHtml(s.name)}</div>
                            <div class="detail">${s.tickets ? s.tickets.length : 0} بلیط | ${s.date || ''}</div>
                        </div>
                        <div class="session-actions">
                            <button class="btn btn-sm btn-outline select-session" data-id="${s.id}">${isActive ? '✅ فعال' : 'انتخاب'}</button>
                            <button class="btn btn-sm btn-danger delete-session" data-id="${s.id}">🗑</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // رویدادها
            container.querySelectorAll('.select-session').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    selectSession(id);
                });
            });
            container.querySelectorAll('.delete-session').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    deleteSession(id);
                });
            });
        }

        function selectSession(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            currentSessionId = id;
            tickets = session.tickets || [];
            document.getElementById('currentSessionName').textContent = session.name;
            document.getElementById('ticketFormCard').style.display = 'block';
            document.getElementById('ticketListCard').style.display = 'block';
            renderSessions();
            renderTicketList();
            updateStats();
            saveData();
        }

        function createSession() {
            const name = prompt('نام سانس را وارد کنید (مثال: سانس عصر، اکران ویژه)');
            if (!name || !name.trim()) return;
            const session = {
                id: 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                name: name.trim(),
                date: new Date().toLocaleDateString('fa-IR'),
                tickets: [],
                createdAt: Date.now()
            };
            sessions.push(session);
            saveData();
            renderSessions();
            selectSession(session.id);
        }

        function deleteSession(id) {
            if (!confirm('این سانس و تمام بلیط‌های آن حذف شود؟')) return;
            sessions = sessions.filter(s => s.id !== id);
            if (currentSessionId === id) {
                currentSessionId = null;
                tickets = [];
                document.getElementById('ticketFormCard').style.display = 'none';
                document.getElementById('ticketListCard').style.display = 'none';
            }
            saveData();
            renderSessions();
        }

        // ==================== بلیط ====================
        function renderTicketList() {
            const container = document.getElementById('ticketListContainer');
            if (!container) return;
            document.getElementById('ticketCount').textContent = tickets.length;
            if (!tickets.length) {
                container.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:20px 0;">هیچ بلیطی ثبت نشده است</div>`;
                return;
            }
            // ... (منطق رندر بلیط‌ها مثل قبل)
        }

        function addTicket() {
            if (!currentSessionId) { alert('ابتدا یک سانس انتخاب یا ایجاد کنید'); return; }
            const name = document.getElementById('inputName').value.trim();
            const count = parseInt(document.getElementById('inputCount').value) || 1;
            const row = document.getElementById('inputRow').value.trim();
            const seat = document.getElementById('inputSeat').value.trim();
            if (!name) { alert('نام را وارد کنید'); return; }
            
            const ticket = {
                id: 'tkt_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
                name, ticketCount: count, row: row || '-', seatNumber: seat || '-',
                checked: false, createdAt: Date.now()
            };
            tickets.push(ticket);
            
            // به‌روزرسانی سانس جاری
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) session.tickets = tickets;
            
            saveData();
            renderTicketList();
            updateStats();
            document.getElementById('inputName').value = '';
            document.getElementById('inputCount').value = '1';
            document.getElementById('inputRow').value = '';
            document.getElementById('inputSeat').value = '';
        }

        // ==================== قفل و امنیت ====================
        async function initLock() {
            const lockScreen = document.getElementById('lockScreen');
            const mainApp = document.getElementById('mainApp');

            // بررسی وجود اثر انگشت
            try {
                const result = await BiometricAuth.checkBiometry();
                if (result.isAvailable) {
                    document.getElementById('btnBiometric').style.display = 'block';
                } else {
                    document.getElementById('btnBiometric').style.display = 'none';
                }
            } catch(e) {
                document.getElementById('btnBiometric').style.display = 'none';
            }

            // تلاش برای ورود خودکار با اثر انگشت
            try {
                const result = await BiometricAuth.checkBiometry();
                if (result.isAvailable) {
                    await authenticateWithBiometric();
                }
            } catch(e) { /* ignore */ }

            // دکمه ورود با اثر انگشت
            document.getElementById('btnBiometric').addEventListener('click', authenticateWithBiometric);
            
            // دکمه ورود با رمز
            document.getElementById('btnPasswordLogin').addEventListener('click', function() {
                const pass = document.getElementById('lockPassword').value.trim();
                // رمز پیش‌فرض: 1234 (قابل تغییر)
                if (pass === '1234' || pass === '123') {
                    unlockApp();
                } else {
                    alert('رمز عبور اشتباه است');
                    document.getElementById('lockPassword').value = '';
                }
            });

            // Enter در فیلد رمز
            document.getElementById('lockPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('btnPasswordLogin').click();
            });
        }

        async function authenticateWithBiometric() {
            try {
                await BiometricAuth.authenticate({
                    reason: 'برای ورود به اپلیکیشن بلیطی',
                    cancelTitle: 'لغو',
                    allowDeviceCredentials: true
                });
                unlockApp();
            } catch(e) {
                console.warn('Biometric auth failed:', e);
                // نمایش پیام خطا
                if (e.code === 'userCancel' || e.code === 'userFallback') {
                    // کاربر لغو کرد یا از رمز استفاده کرد
                    document.getElementById('lockPassword').focus();
                }
            }
        }

        function unlockApp() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            // بارگذاری داده‌ها
            initApp();
        }

        // ==================== راه‌اندازی ====================
        async function initApp() {
            await loadData();
            renderSessions();
            
            // اگر سانس فعال وجود داشت، انتخابش کن
            if (currentSessionId) {
                const session = sessions.find(s => s.id === currentSessionId);
                if (session) {
                    tickets = session.tickets || [];
                    document.getElementById('currentSessionName').textContent = session.name;
                    document.getElementById('ticketFormCard').style.display = 'block';
                    document.getElementById('ticketListCard').style.display = 'block';
                    renderTicketList();
                    updateStats();
                }
            }
            
            // رویدادها
            document.getElementById('btnNewSession').addEventListener('click', createSession);
            document.getElementById('btnAddTicket').addEventListener('click', addTicket);
            // ... سایر رویدادها
        }

        // شروع
        initLock();
    </script>
</body>
</html>
