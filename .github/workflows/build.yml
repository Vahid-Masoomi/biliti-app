name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ➕ Add Android Platform
        run: |
          npx cap add android || echo "Android platform already exists"

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 📋 Copy Web Assets
        run: npx cap copy android

      - name: 🔐 Add Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "قبل از تغییرات:"
          cat "$MANIFEST"
          
          # اضافه کردن مجوزها قبل از </manifest>
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            python3 << 'PYEOF'
import re
manifest_path = "android/app/src/main/AndroidManifest.xml"
with open(manifest_path, 'r', encoding='utf-8') as f:
    content = f.read()

# اضافه کردن مجوزها
permissions = '''
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.USE_BIOMETRIC" />
    <uses-permission android:name="android.permission.USE_FINGERPRINT" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
    <uses-feature android:name="android.hardware.camera" android:required="true" />
    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
    <uses-feature android:name="android.hardware.fingerprint" android:required="false" />
'''

if 'android.permission.CAMERA' not in content:
    content = content.replace('</manifest>', permissions + '</manifest>')

# اضافه کردن windowSoftInputMode به activity
if 'windowSoftInputMode' not in content:
    content = content.replace(
        'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"',
        'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"\n            android:windowSoftInputMode="adjustResize"'
    )

with open(manifest_path, 'w', encoding='utf-8') as f:
    f.write(content)
print("AndroidManifest.xml updated")
PYEOF
          fi
          
          echo "بعد از تغییرات:"
          cat "$MANIFEST"

      - name: 🎯 Overwrite MainActivity.java
        run: |
          mkdir -p android/app/src/main/java/ir/vahidmsm/biliti
          cat > android/app/src/main/java/ir/vahidmsm/biliti/MainActivity.java << 'JAVAEOF'
package ir.vahidmsm.biliti;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Build;
import android.os.Bundle;
import android.view.View;
import android.view.WindowManager;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {

    private static final int CAMERA_PERMISSION_CODE = 100;
    private PermissionRequest pendingRequest;

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        // تنظیم حالت کیبورد
        getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);

        // درخواست مجوز دوربین از ابتدا
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                != PackageManager.PERMISSION_GRANTED) {
            ActivityCompat.requestPermissions(this,
                    new String[]{Manifest.permission.CAMERA},
                    CAMERA_PERMISSION_CODE);
        }

        WebView webView = getBridge().getWebView();
        WebSettings settings = webView.getSettings();
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setJavaScriptEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setMediaPlaybackRequiresUserGesture(false);
        settings.setLoadWithOverviewMode(true);
        settings.setUseWideViewPort(true);
        settings.setSupportZoom(false);

        webView.setFocusable(true);
        webView.setFocusableInTouchMode(true);
        webView.requestFocus(View.FOCUS_DOWN);

        // WebChromeClient برای مدیریت مجوز دوربین
        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onPermissionRequest(final PermissionRequest request) {
                runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                        boolean wantsCamera = false;
                        for (String resource : request.getResources()) {
                            if (resource.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {
                                wantsCamera = true;
                                break;
                            }
                        }

                        if (wantsCamera) {
                            if (ContextCompat.checkSelfPermission(MainActivity.this,
                                    Manifest.permission.CAMERA)
                                    == PackageManager.PERMISSION_GRANTED) {
                                request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                            } else {
                                pendingRequest = request;
                                ActivityCompat.requestPermissions(MainActivity.this,
                                        new String[]{Manifest.permission.CAMERA},
                                        CAMERA_PERMISSION_CODE);
                            }
                        } else {
                            request.deny();
                        }
                    }
                });
            }
        });
    }

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);

        if (requestCode == CAMERA_PERMISSION_CODE) {
            if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                if (pendingRequest != null) {
                    pendingRequest.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                    pendingRequest = null;
                }
            } else {
                if (pendingRequest != null) {
                    pendingRequest.deny();
                    pendingRequest = null;
                }
            }
        }
    }
}
JAVAEOF
          echo "MainActivity.java created"

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: biliti-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 🚀 Upload to Release (if release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true